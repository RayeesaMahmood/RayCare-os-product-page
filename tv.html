<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lobby Display · RayCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@500;700&family=JetBrains+Mono:wght@600;700&family=Noto+Sans+Devanagari:wght@600&family=Noto+Sans+Telugu:wght@600&display=swap">
<style>
/* RayCare design tokens and shared primitives.
   Used by the staff app, lobby TV, patient tracker and QR check-in pages. */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --sunk:#E9EEF6; --ink:#0B1B3A; --muted:#56637C; --line:#D9E1EE;
  --brand:#1D4ED8; --brand-ink:#FFFFFF; --brand-soft:#E2E9FF; --signal:#E8641A; --signal-soft:#FFEADD;
  --rail:#07112B; --rail-2:#0E1C40; --rail-line:#1B2A55; --rail-text:#A9B7DE; --led:#FFB547;
  --ok:#15803D; --warn:#B7791F; --crit:#D92D20;
  --esi1:#D92D20; --esi2:#E8641A; --esi3:#C98A04; --esi4:#15803D; --esi5:#2563EB;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-indic:"Noto Sans Devanagari","Noto Sans Telugu",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(11,27,58,.06),0 12px 30px -14px rgba(11,27,58,.22);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060C1B; --surface:#0E172D; --sunk:#0A1224; --ink:#E6EBF6; --muted:#97A4BE; --line:#1F2E4C;
  --brand:#7A9BFF; --brand-ink:#06102A; --brand-soft:#15234A; --signal:#FF8A45; --signal-soft:#361E10;
  --rail:#030817; --rail-2:#0A1532;
  --ok:#4ADE80; --warn:#F2C14E; --crit:#FF6B5E;
  --esi1:#FF6B5E; --esi2:#FF8A45; --esi3:#F2C14E; --esi4:#4ADE80; --esi5:#7AA2FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.75); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060C1B; --surface:#0E172D; --sunk:#0A1224; --ink:#E6EBF6; --muted:#97A4BE; --line:#1F2E4C;
  --brand:#7A9BFF; --brand-ink:#06102A; --brand-soft:#15234A; --signal:#FF8A45; --signal-soft:#361E10;
  --rail:#030817; --rail-2:#0A1532;
  --ok:#4ADE80; --warn:#F2C14E; --crit:#FF6B5E;
  --esi1:#FF6B5E; --esi2:#FF8A45; --esi3:#F2C14E; --esi4:#4ADE80; --esi5:#7AA2FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.75); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:-.015em;line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:1.7rem;font-weight:800} h2{font-size:1.15rem;font-weight:700} h3{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--brand)}
button{font-family:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.84rem}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:10px;padding:9px 14px;font:700 .86rem/1 var(--f-body);cursor:pointer;white-space:nowrap;transition:transform .12s,background .15s,border-color .15s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.b-pri{background:var(--brand);color:var(--brand-ink)}
.b-sig{background:var(--signal);color:#fff}
.b-crit{background:var(--crit);color:#fff}
.b-ok{background:var(--ok);color:#fff}
.b-gh{background:var(--surface);border-color:var(--line);color:var(--ink)}
.b-gh:hover{border-color:var(--muted)}
.b-sm{padding:6px 10px;font-size:.78rem;border-radius:8px}
.b-lg{padding:13px 20px;font-size:.98rem;border-radius:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h p{font-size:.82rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font:700 .7rem/1 var(--f-body);padding:5px 7px;border-radius:6px;color:#fff;white-space:nowrap}
.e1{background:var(--esi1)}.e2{background:var(--esi2)}.e3{background:var(--esi3)}.e4{background:var(--esi4)}.e5{background:var(--esi5)}
.c-walk{background:var(--sunk);color:var(--muted)} .c-pri{background:var(--brand-soft);color:var(--brand)} .c-appt{background:color-mix(in srgb,#14A3A1 18%,transparent);color:#0E8C8A}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.p-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.p-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.p-crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)}
.p-info{color:var(--brand);background:var(--brand-soft)}
.p-mute{color:var(--muted);background:var(--sunk)}
.ddot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}
.empty{display:grid;place-items:center;gap:6px;text-align:center;padding:26px 14px;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px;font-size:.88rem}

form.f{display:grid;gap:12px}
.field{display:grid;gap:5px;min-width:0}
.field>label,.flabel{font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:420px){.r3{grid-template-columns:1fr 1fr}}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .92rem var(--f-body)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
input[type=range]{width:100%;accent-color:var(--brand)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap;background:var(--surface)}
.seg label{flex:1;text-align:center;padding:8px 6px;cursor:pointer;font-size:.8rem;font-weight:700;color:var(--muted);border-left:1px solid var(--line);position:relative;white-space:nowrap}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--brand-soft);color:var(--brand)}
.seg label:has(input:focus-visible){outline:2px solid var(--signal);outline-offset:-2px}
.tog{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.86rem;font-weight:600;user-select:none}
.tog input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s;flex:none}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.tog input:checked{background:var(--ok)}
.tog input:checked::after{transform:translateX(14px)}
.err{color:var(--crit);font-size:.84rem;font-weight:600}

.board{background:var(--rail);border-radius:16px;padding:16px;color:var(--rail-text);position:relative;overflow:hidden}
.led{font:700 1.4rem/1 var(--f-mono);color:var(--led);text-shadow:0 0 12px rgba(255,181,71,.45);white-space:nowrap}
.led.flash{animation:ledf 1.1s ease 2}
@keyframes ledf{50%{color:#fff;text-shadow:0 0 22px rgba(255,255,255,.85)}}
.brandmark{display:inline-flex;align-items:center;gap:10px;font:800 1.1rem/1 var(--f-display);letter-spacing:-.02em;text-decoration:none;color:inherit}
.toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:95;display:grid;gap:8px;width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:.88rem;box-shadow:var(--shadow);animation:tin .25s ease}
.toast.bad{background:var(--crit);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

</style>
<style>
/* Layout: full-bleed LED board for a lobby TV; always dark by design */
:root{color-scheme:dark}
html,body{height:100%}
body{background:#040A1C;color:#C9D4F2;overflow:hidden}
.tv{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(16px,3vw,40px);gap:clamp(12px,2vh,24px)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px dashed #1B2A55;padding-bottom:clamp(10px,2vh,20px)}
.hn{font:700 clamp(.8rem,1.2vw,1.1rem) var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:#8EA0D6}
.lang{font:700 clamp(1.6rem,3.4vw,3.2rem)/1.15 var(--f-indic);color:#FFB547;min-height:1.2em;transition:opacity .3s}
.clk{font:700 clamp(1.8rem,3.6vw,3.6rem)/1 var(--f-mono);color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) auto auto auto;column-gap:clamp(16px,3vw,48px);align-content:start;overflow:hidden}
.h{font:700 clamp(.7rem,1vw,.95rem)/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:#6F80B6;padding:0 4px clamp(8px,1.5vh,14px)}
.c{padding:clamp(10px,2vh,20px) 4px;border-top:1px solid #1B2A55;display:flex;align-items:center}
.dn{display:grid;color:#fff;font-weight:700;font-size:clamp(1.1rem,2.2vw,2.2rem);line-height:1.15;min-width:0}
.dn small{font-weight:500;color:#7F90C3;font-size:.55em}
.dn i{display:inline-block;width:.45em;height:.45em;border-radius:3px;margin-right:.35em;vertical-align:.12em}
.led{font:700 clamp(1.8rem,4.2vw,4.4rem)/1 var(--f-mono);color:#FFB547;text-shadow:0 0 18px rgba(255,181,71,.5)}
.nx{font:600 clamp(1rem,2vw,2rem) var(--f-mono);color:#9FB0E0}
.wt{font:700 clamp(.95rem,1.8vw,1.8rem) var(--f-mono);color:#9FB0E0;justify-content:flex-end}
.foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font:600 clamp(.85rem,1.4vw,1.3rem) var(--f-mono)}
.foot span.call{border:1px solid #1B2A55;border-radius:10px;padding:6px 12px}
.foot .lbl{font-family:var(--f-body);color:#6F80B6;font-size:.8em;letter-spacing:.12em}
.sound{position:fixed;right:16px;bottom:16px;background:#0E1C40;color:#fff;border:1px solid #1B2A55;border-radius:10px;padding:10px 14px;font:700 .9rem var(--f-body);cursor:pointer}
.note{position:fixed;left:16px;bottom:16px;font:600 .8rem var(--f-body);color:#6F80B6}
@media (max-width:700px){.grid{grid-template-columns:minmax(0,1fr) auto auto}.nxc{display:none}}
</style>
</head>
<body>
<div class="tv"><div class="top"><div><div class="hn" id="hn">RayCare</div><div class="lang" id="lang">Now serving</div></div><div class="clk" id="clk">--:--</div></div>
<div class="grid" id="grid"></div><div class="foot" id="foot"></div></div>
<button class="sound" id="sound" type="button">Turn on announcements</button>
<div class="note" id="note" hidden></div>
<script>
/*!
 * RayCare engine — the single source of truth for queue, triage, bed and
 * appointment logic. Pure JavaScript, no dependencies.
 *
 * The same file runs in two places:
 *   - on the server (Node.js), wrapped with persistence, auth and realtime
 *   - in the browser, for the offline demo mode
 *
 * Every change goes through `engine.dispatch(command, payload, actor, now)`.
 * The engine records what changed; `engine.takeDelta()` returns those
 * entities so the server can persist them and stream them to clients, and
 * `applyDelta(state, delta)` merges them into a client-side copy.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.RayCareEngine = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const MIN = 60000;
  const VERSION = '2.0.0';

  /* ------------------------------------------------------------------ *
   * Reference data
   * ------------------------------------------------------------------ */
  const TEMPLATES = {
    GEN: { name: 'General Medicine', pre: 'G', avg: 6, color: '#3B6FF5' },
    PED: { name: 'Paediatrics', pre: 'P', avg: 7, color: '#8B5CF6' },
    CAR: { name: 'Cardiology', pre: 'C', avg: 11, color: '#E0457B' },
    DER: { name: 'Dermatology', pre: 'D', avg: 7, color: '#14A3A1' },
    ORT: { name: 'Orthopaedics', pre: 'O', avg: 8, color: '#E8910C' },
    ENT: { name: 'ENT', pre: 'N', avg: 7, color: '#0EA5E9' },
    GYN: { name: 'Obstetrics & Gynaecology', pre: 'W', avg: 10, color: '#DB2777' },
    OPH: { name: 'Ophthalmology', pre: 'Y', avg: 6, color: '#65A30D' },
    DEN: { name: 'Dental', pre: 'T', avg: 12, color: '#F97316' },
    NEU: { name: 'Neurology', pre: 'U', avg: 12, color: '#6366F1' }
  };
  const ER = { id: 'ER', name: 'Emergency', pre: 'E', avg: 14, color: '#E5484D', room: 'Resus bay', doc: 'On-call ER team', floor: 'East entrance, ambulance bay', open: true, rooms: 1 };
  const WARD_TYPES = { ICU: { name: 'ICU', prefix: 'I' }, GW: { name: 'General Ward', prefix: 'A' }, PW: { name: 'Paediatric Ward', prefix: 'P' } };
  const LANGS = { en: 'English', hi: 'हिन्दी', te: 'తెలుగు', ta: 'தமிழ்', kn: 'ಕನ್ನಡ', ur: 'اردو' };
  const OUTCOMES = ['Prescription issued', 'Lab tests ordered', 'Imaging ordered', 'Follow-up in 2 weeks', 'Discharged home', 'Admit'];
  const ESI_LABEL = { 1: 'Immediate', 2: 'Emergent', 3: 'Urgent', 4: 'Less urgent', 5: 'Non-urgent' };
  const COMPLAINTS = { chest: 'Chest pain', stroke: 'Stroke signs', breath: 'Breathing difficulty', trauma: 'Injury / accident', abdo: 'Abdominal pain', fever: 'Fever', minor: 'Minor cut or sprain', rx: 'Prescription refill' };
  /* Typical OPD arrival profile by hour (relative). Used for the forecast. */
  const PROFILE = { 8: 0.55, 9: 0.9, 10: 1, 11: 1, 12: 0.85, 13: 0.5, 14: 0.7, 15: 0.75, 16: 0.55, 17: 0.3 };
  const CLEANING_MIN = 20;
  const MAX_LATE = 2;

  /* Who may run which command. `system` is the server itself. */
  const COMMANDS = {
    registerPatient: ['admin', 'desk', 'system'],
    callNext: ['admin', 'desk', 'doctor', 'nurse', 'system'],
    callVisit: ['admin', 'desk', 'doctor', 'nurse'],
    completeVisit: ['admin', 'doctor', 'nurse', 'system'],
    markNoShow: ['admin', 'desk', 'doctor', 'nurse'],
    recall: ['admin', 'desk', 'doctor', 'nurse'],
    runningLate: ['admin', 'desk', 'patient', 'system'],
    triage: ['admin', 'nurse', 'doctor', 'system'],
    overrideEsi: ['admin', 'doctor'],
    ambulancePreAlert: ['admin', 'nurse', 'desk', 'system'],
    prepareBay: ['admin', 'nurse', 'doctor'],
    assignBed: ['admin', 'nurse'],
    dischargeBed: ['admin', 'nurse', 'doctor'],
    markBedReady: ['admin', 'nurse'],
    bookAppointment: ['admin', 'desk'],
    checkInAppointment: ['admin', 'desk'],
    submitFeedback: ['admin', 'desk', 'patient', 'system'],
    updateSettings: ['admin'],
    updateDepartment: ['admin'],
    addDepartment: ['admin'],
    codeBlue: ['admin', 'nurse', 'doctor', 'desk'],
    clearCodeBlue: ['admin', 'nurse', 'doctor'],
    ackAlerts: ['admin', 'desk', 'doctor', 'nurse'],
    markNotified: ['system']
  };
  const ROLES = { admin: 'Administrator', desk: 'Front desk', doctor: 'Doctor', nurse: 'Nurse', patient: 'Patient', system: 'System' };

  class EngineError extends Error {
    constructor(code, message) { super(message); this.name = 'EngineError'; this.code = code; }
  }
  const fail = (code, msg) => { throw new EngineError(code, msg); };

  /* ------------------------------------------------------------------ *
   * Time helpers (hospital local time)
   * ------------------------------------------------------------------ */
  const pad = n => String(n).padStart(2, '0');
  function dayKey(ms) { const d = new Date(ms); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
  function startOfDay(ms) { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function atMinute(ms, minuteOfDay) { return startOfDay(ms) + minuteOfDay * MIN; }
  function hourOf(ms) { return new Date(ms).getHours(); }
  function mins(from, to) { return Math.max(0, Math.round((to - from) / MIN)); }
  function hhmm(ms) { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function clock12(ms) { const d = new Date(ms); const h = d.getHours(); return (h % 12 || 12) + ':' + pad(d.getMinutes()) + (h >= 12 ? ' PM' : ' AM'); }

  /* ------------------------------------------------------------------ *
   * Validation helpers
   * ------------------------------------------------------------------ */
  function str(v, field, { min = 0, max = 120, required = false } = {}) {
    const s = v == null ? '' : String(v).trim().replace(/\s+/g, ' ');
    if (required && !s) fail('invalid', `${field} is required`);
    if (s.length < min) fail('invalid', `${field} is too short`);
    if (s.length > max) fail('invalid', `${field} is too long (max ${max})`);
    return s;
  }
  function num(v, field, { min = -Infinity, max = Infinity, fallback } = {}) {
    if ((v === '' || v == null) && fallback !== undefined) return fallback;
    const n = Number(v);
    if (!Number.isFinite(n)) fail('invalid', `${field} must be a number`);
    if (n < min || n > max) fail('invalid', `${field} must be between ${min} and ${max}`);
    return n;
  }
  const digits = p => String(p || '').replace(/\D/g, '');
  function maskPhone(p) { const d = digits(p); return d.length >= 10 ? d.slice(-10, -8) + 'xxxxx' + d.slice(-3) : ''; }

  /* ------------------------------------------------------------------ *
   * State
   * ------------------------------------------------------------------ */
  function createState(cfg = {}) {
    const h = cfg.hospital || {};
    const depts = (cfg.depts || []).map((d, i) => {
      const t = TEMPLATES[d.id] || {};
      return {
        id: d.id, name: d.name || t.name || d.id, pre: d.pre || t.pre || d.id[0],
        avg: d.avg || t.avg || 8, color: d.color || t.color || '#3B6FF5',
        room: d.room || 'OPD ' + (i + 1), doc: d.doc || 'Duty doctor',
        floor: d.floor || 'Ground floor', open: d.open !== false, rooms: 1
      };
    });
    if (!depts.find(d => d.id === 'ER')) depts.push({ ...ER });
    const beds = [];
    (cfg.wards || [{ id: 'ICU', count: 8 }, { id: 'GW', count: 16 }, { id: 'PW', count: 10 }]).forEach(w => {
      const t = WARD_TYPES[w.id]; if (!t) return;
      for (let i = 1; i <= w.count; i++) beds.push({ id: t.prefix + '-' + pad(i), ward: w.id, status: 'free', pid: null, name: null, since: 0 });
    });
    return {
      schema: 1,
      hospital: {
        name: h.name || 'My Hospital', city: h.city || '', langs: h.langs || ['en', 'hi', 'te'],
        sla: { busy: 20, over: 45, ...(h.sla || {}) }, publicCheckin: h.publicCheckin !== false,
        setupComplete: !!h.setupComplete, createdAt: h.createdAt || 0
      },
      depts,
      wardNames: { ICU: 'ICU', GW: 'General Ward A', PW: 'Paediatric Ward', ...(cfg.wardNames || {}) },
      counters: { day: '', tok: {}, patient: 1000, req: 1, amb: 1, fb: 1, alert: 1 },
      serving: {},
      visits: {}, patients: {}, beds, bedReqs: [], ambulances: [], appts: [], feedback: [], alerts: [],
      audit: [], recall: null, codeBlue: null, lastCalls: [], v: 0
    };
  }

  /* ------------------------------------------------------------------ *
   * Selectors (pure reads)
   * ------------------------------------------------------------------ */
  const dept = (st, id) => st.depts.find(d => d.id === id);
  const opdDepts = st => st.depts.filter(d => d.id !== 'ER');
  const visitsList = st => Object.values(st.visits);
  const todayVisits = (st, now) => { const k = dayKey(now); return visitsList(st).filter(v => v.day === k); };

  /* Priority: ESI 1-2, ESI 3, priority flag, appointment, other ESI, walk-in. */
  function sortKey(v) { return v.esi && v.esi <= 2 ? v.esi : v.esi === 3 ? 3 : v.pri ? 4 : v.appt ? 5 : v.esi ? 6 + v.esi : 9; }
  function waiting(st, id) {
    return visitsList(st).filter(v => v.dept === id && v.status === 'waiting')
      .sort((a, b) => (sortKey(a) - sortKey(b)) || ((a.arrived + (a.lateOffset || 0)) - (b.arrived + (b.lateOffset || 0))));
  }
  /* Consult pace learns from today's real consults once there are 5 or more. */
  function pace(st, id, now) {
    const d = dept(st, id); if (!d) return 8;
    const k = dayKey(now);
    const durs = visitsList(st).filter(v => v.dept === id && v.day === k && v.status === 'done' && v.start && v.end && v.outcome !== 'No-show')

    durs.sort((a, b) => a - b);

  function remaining(st, id, now) {

  function stats(st, now) {
    const today = todayVisits(st, now);
    const started = today.filter(v => v.start);

    const done = today.filter(v => v.status === 'done');
    const hourly = {}, waitByHour = {}, waitByDept = {};

    started.forEach(v => {
      const h = hourOf(v.start), w = (v.start - v.arrived) / MIN;

  }

  function suggestion(st, now) {
    const rows = opdDepts(st).filter(d => d.open).map(d => ({ d, m: newWait(st, d.id, now) }));

  /* Emergency Severity Index suggestion (simplified ESI v4 decision points). */
  function triage(i) {

  }

  /* Public, name-free projection for lobby screens. */
  function board(st, now) {

      hospital: st.hospital.name, now,
      rows: st.depts.filter(d => d.open).map(d => {
        const c = st.serving[d.id] && st.visits[st.serving[d.id]], n = waiting(st, d.id)[0];

      recall: st.recall, lastCalls: st.lastCalls.slice(0, 6), langs: st.hospital.langs

  }

  /* Compact snapshot for the AI Copilot. */
  function snapshot(st, now) {
    const s = stats(st, now);
    return {
      time: clock12(now), hospital: st.hospital.name,
      departments: opdDepts(st).map(d => ({ id: d.id, name: d.name, doctor: d.doc, open: d.open, waiting: waiting(st, d.id).length, now_serving: st.serving[d.id] ? st.visits[st.serving[d.id]].tok : null, new_arrival_wait_min: newWait(st, d.id, now), status: slaStatus(st, newWait(st, d.id, now)) })),
      emergency: { in_resus: st.serving.ER ? st.visits[st.serving.ER].tok : null, waiting: waiting(st, 'ER').map(v => ({ token: v.tok, esi: v.esi, waited_min: mins(v.arrived, now) })) },
      ambulances_inbound: inboundAmbulances(st).map(a => ({ id: a.id, complaint: a.complaint, esi: a.esi, eta_min: mins(now, a.arriveAt), bay_prepared: a.prepared })),
      beds: Object.keys(WARD_TYPES).map(w => ({ ward: st.wardNames[w], ...occupancy(st, w) })).filter(b => b.total),
      pending_admissions: openBedReqs(st).map(r => ({ id: r.id, patient: r.name, needs: st.wardNames[r.ward], waiting_min: mins(r.at, now) })),
      today: { patients_seen: s.served, avg_wait_min: s.avgWait, median_wait_min: s.medianWait, sla_compliance_pct: s.slaCompliance, patient_pulse: s.pulse, no_show_rate_pct: s.noShowRate },
      forecast_next_hours: s.forecast, suggestion: suggestion(st, now)

  }

  /* ------------------------------------------------------------------ *
   * Deltas
   * ------------------------------------------------------------------ */
  const LISTS = ['beds', 'bedReqs', 'ambulances', 'appts', 'feedback', 'alerts'];
  function applyDelta(st, d) {
    if (!d) return st;
    if (d.meta) Object.assign(st, d.meta);
    (d.visits || []).forEach(v => { if (v._removed) delete st.visits[v.id]; else st.visits[v.id] = v; });
    (d.patients || []).forEach(p => { st.patients[p.pid] = p; });
    LISTS.forEach(k => (d[k] || []).forEach(item => {
      const i = st[k].findIndex(x => x.id === item.id);

  }

  /* ------------------------------------------------------------------ *
   * Engine
   * ------------------------------------------------------------------ */
  function createEngine(state, opts = {}) {
    const st = state;
    const rng = opts.rng || Math.random;
    const genKey = opts.genKey || (() => Math.floor(rng() * 36 ** 8).toString(36).padStart(8, '0'));
    let dirty = freshDirty();
    const breach = {};
    function freshDirty() { return { meta: false, visits: new Set(), patients: new Set(), audit: [], ...Object.fromEntries(LISTS.map(k => [k, new Set()])) }; }
    const touch = (k, id) => dirty[k].add(id);
    const touchMeta = () => { dirty.meta = true; };

    function audit(actor, action, text, now) {
      const e = { t: now, who: actor.name || ROLES[actor.role] || 'Unknown', role: actor.role, action, text };

    }

        for (let m = 9 * 60; m < 13 * 60; m += 15) {

    function findOrCreatePatient(p, now) {

    function visitOr404(id) { const v = st.visits[id]; if (!v) fail('not_found', 'Visit not found'); return v; }
    function deptOr404(id) { const d = dept(st, id); if (!d) fail('not_found', 'Department not found'); return d; }
    const langOk = l => (st.hospital.langs.includes(l) ? l : 'en');

    const handlers = {
      registerPatient(p, actor, now) {
        const name = str(p.name, 'Name', { required: true, max: 80 });
        const d = deptOr404(p.dept);

        if (!d.open) fail('closed', `${d.name} is closed right now`);
        const pt = findOrCreatePatient({ name, phone: str(p.phone, 'Phone', { max: 20 }), abha: str(p.abha, 'ABHA', { max: 20 }), age: p.age === '' || p.age == null ? null : num(p.age, 'Age', { min: 0, max: 125 }), sex: str(p.sex, 'Sex', { max: 10 }) }, now);
        if (visitsList(st).some(v => v.pid === pt.pid && v.dept === d.id && (v.status === 'waiting' || v.status === 'serving'))) fail('duplicate', `${name} is already in the ${d.name} queue`);
        const v = newVisit(d, pt, { pri: !!p.priority, appt: !!p.appt, lang: langOk(p.lang), src: str(p.source, 'Source', { max: 60 }) || 'Registered at desk' }, now);
        const e = eta(st, v.id, now);
        audit(actor, 'registerPatient', `Registered ${name} as ${v.tok} in ${d.name}`, now);
        return { id: v.id, tok: v.tok, trackKey: v.trackKey, position: e.pos, etaMin: e.mins, room: d.room };
      },
      callNext(p, actor, now) {
        const d = deptOr404(p.dept);
        const v = serve(d.id, null, p.outcome, now, actor);

        return { called: v ? v.tok : null, id: v ? v.id : null, room: d.room };
      },
      callVisit(p, actor, now) {
        const v = visitOr404(p.id);

        return { called: v.tok };
      },
      completeVisit(p, actor, now) {
        const d = deptOr404(p.dept);

        let referred = null;
        if (p.referTo) {

      },
      recall(p, actor, now) {
        const d = deptOr404(p.dept);

        if (!v) fail('invalid', 'No one to recall');
        st.recall = { dept: d.id, tok: v.tok, room: d.room, lang: v.lang, t: now }; touchMeta();
        audit(actor, 'recall', `Recalled ${v.tok} to ${d.room}`, now);
        return { tok: v.tok };
      },
      runningLate(p, actor, now) {
        const v = visitOr404(p.id);

      },
      triage(p, actor, now) {

        const t = triage(p);
        const pt = findOrCreatePatient({ name, age: p.age === '' || p.age == null ? null : num(p.age, 'Age', { min: 0, max: 125 }), sex: str(p.sex, 'Sex', { max: 10 }) }, now);
        const v = newVisit(dept(st, 'ER'), pt, { esi: t.level, lang: langOk(p.lang), src: p.source || `Triaged ESI ${t.level} (${COMPLAINTS[p.complaint] || 'unspecified'})` }, now);

      },
      overrideEsi(p, actor, now) {

      },
      ambulancePreAlert(p, actor, now) {
        const a = { id: 'AMB-' + (st.counters.amb++), from: str(p.from, 'From', { required: true, max: 60 }), complaint: str(p.complaint, 'Complaint', { required: true, max: 120 }), esi: num(p.esi, 'ESI', { min: 1, max: 5 }), arriveAt: now + num(p.etaMin, 'ETA', { min: 1, max: 240 }) * MIN, prepared: false, status: 'inbound', at: now };

  }

  return {

    4: ['Clear directions to the room.', 'Estimate was close. Good system.', 'Registration was quick.'],

    depts: [

      { id: 'PED', room: 'OPD 3', doc: 'Dr. Farah Khan', floor: 'Ground floor, follow the purple line' },
      { id: 'CAR', room: 'OPD 4', doc: 'Dr. Anil Rao', floor: 'Ground floor, follow the pink line' },
      { id: 'DER', room: 'OPD 5', doc: 'Dr. Kavya Iyer', floor: 'Ground floor, next to the lab' },

    if (c && c.t > lastCall) { if (lastCall) { flash = c.dept; speak(c.tok, c.room, c.lang); } lastCall = c.t; }
    if (board.recall && board.recall.t > lastRecall) { if (lastRecall) { flash = board.recall.dept; speak(board.recall.tok, board.recall.room, board.recall.lang); } lastRecall = board.recall.t; }
    $('#grid').innerHTML = '<div class="h">Department</div><div class="h">Token</div><div class="h nxc">Next</div><div class="h" style="text-align:right">Wait</div>' + board.rows.map(r => `<div class="c dn"><span><i style="background:${r.color}"></i>${esc(r.name)}</span><small>${esc(r.room)}</small></div><div class="c"><span class="led ${flash === r.id ? 'flash' : ''}">${r.serving || '—'}</span></div><div class="c nx nxc">${r.next || '—'}</div><div class="c wt" style="${r.id === 'ER' ? 'color:#FF8A7E' : ''}">${r.id === 'ER' ? 'By triage' : '~' + r.wait + ' min'}</div>`).join('');
    $('#foot').innerHTML = '<span class="lbl">RECENT CALLS</span>' + board.lastCalls.slice(0, 6).map(x => `<span class="call">${x.tok} → ${esc(x.room)}</span>`).join('');
    flash = null;
  }
  setInterval(() => { const langs = (board && board.langs || ['en']).filter(l => LANG[l]); li = (li + 1) % langs.length; const L = LANG[langs[li]]; const el = $('#lang'); el.style.opacity = 0; setTimeout(() => { el.textContent = L[0]; el.style.fontFamily = L[1]; el.style.opacity = 1; }, 300); }, 4000);
  setInterval(() => { $('#clk').textContent = E.clock12(now()); }, 1000);
  $('#sound').addEventListener('click', () => { voice = !voice; $('#sound').textContent = voice ? 'Announcements on' : 'Turn on announcements'; if (voice) speak('R-1', 'the lobby', 'en'); });
  document.addEventListener('dblclick', () => { try { document.documentElement.requestFullscreen().catch(() => {}); } catch (e) { /* ignore */ } });

  async function start() {
    try {
      const h = location.protocol === 'file:' ? null : await fetch('/api/health', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
      if (h && h.ready) {
        rate = h.clockRate || 1;
        const es = new EventSource('/api/public/stream');
        es.addEventListener('board', ev => { board = JSON.parse(ev.data); serverNow = board.now; at = Date.now(); render(); });
        es.onerror = () => { $('#note').hidden = false; $('#note').textContent = 'Reconnecting…'; };
        es.onopen = () => { $('#note').hidden = true; };
        return;
      }
      if (h && !h.ready) { $('#note').hidden = false; $('#note').textContent = 'Finish the setup wizard in the staff app first.'; return; }
    } catch (e) { /* fall through to demo */ }
    // No server: run the demo hospital locally so the screen can be previewed.
    let t = E.atMinute(Date.now(), 10 * 60 + 40); const d = window.RayCareSimulator.createDemo(t);
    serverNow = t; at = Date.now(); rate = 0; board = E.board(d.state, t); render();
    $('#note').hidden = false; $('#note').textContent = 'Demo data · connect to a RayCare server for your hospital';
    setInterval(() => { t += 2 * E.MIN; d.sim.step(t); d.engine.takeDelta(t); serverNow = t; at = Date.now(); board = E.board(d.state, t); render(); }, 2600);
  }
  start();
})();
</script>
</body>
</html>
