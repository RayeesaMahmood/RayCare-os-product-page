<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Turn · RayCare</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@700&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Sans+Telugu:wght@500;700&display=swap">
<link rel="stylesheet" href="/assets/theme.css">
<style>
/* Layout: single mobile column, patient's live turn */
body{font-family:var(--f-body),var(--f-indic)}
.wrap{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:grid;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.seg-mini{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg-mini button{border:0;background:transparent;padding:7px 10px;font:700 .8rem var(--f-body);cursor:pointer;color:var(--muted)}
.seg-mini button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}
.ring{position:relative;width:210px;height:210px;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.tk{font:700 2.3rem/1 var(--f-mono)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px}
.stats b{font:800 1.5rem var(--f-display);display:block}
.way{border-radius:14px;padding:14px;font-weight:600}
.big{text-align:center;display:grid;gap:10px;padding:36px 0}
.stars{display:flex;gap:8px;justify-content:center}
.stars button{border:0;background:none;font-size:2.2rem;cursor:pointer;color:var(--line);padding:0}
.stars button.on{color:#F5A623}
.foot{text-align:center;font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted" style="text-align:center;padding:60px 0">Loading your visit…</p></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const T = {
    en: { hi: 'Hello', pos: 'Position', wait: 'Est. wait', now: 'Now serving', ahead: 'ahead of you', dir: 'Where to go', late: "I'm running late", lateHint: 'Moves you back 3 places so you keep your turn.', turn: "It's your turn!", go: 'Please go to', done: 'Your visit is complete', rate: 'How was your visit today?', thanks: 'Thank you. Your feedback helps us improve.', refresh: 'Updates automatically', bad: 'This tracking link is not valid or has expired. Please ask at the registration desk.', noshow: 'This token was closed. Please visit the registration desk.', min: 'min' },
    hi: { hi: 'नमस्ते', pos: 'स्थान', wait: 'अनुमानित प्रतीक्षा', now: 'अभी सेवा में', ahead: 'आपसे पहले', dir: 'कहाँ जाएँ', late: 'मुझे देर हो रही है', lateHint: 'आपको 3 स्थान पीछे करता है, बारी बनी रहती है।', turn: 'आपकी बारी है!', go: 'कृपया जाएँ', done: 'आपकी विज़िट पूरी हुई', rate: 'आज आपका अनुभव कैसा रहा?', thanks: 'धन्यवाद। आपकी प्रतिक्रिया से हम बेहतर बनते हैं।', refresh: 'अपने आप अपडेट होता है', bad: 'यह लिंक मान्य नहीं है। कृपया पंजीकरण डेस्क पर पूछें।', noshow: 'यह टोकन बंद हो गया है। कृपया पंजीकरण डेस्क पर जाएँ।', min: 'मिनट' },
    te: { hi: 'నమస్తే', pos: 'స్థానం', wait: 'అంచనా నిరీక్షణ', now: 'ఇప్పుడు సేవలో', ahead: 'మీ ముందు', dir: 'ఎక్కడికి వెళ్ళాలి', late: 'నేను ఆలస్యంగా వస్తున్నాను', lateHint: 'మిమ్మల్ని 3 స్థానాలు వెనక్కి జరుపుతుంది, మీ వంతు ఉంటుంది.', turn: 'మీ వంతు వచ్చింది!', go: 'దయచేసి వెళ్ళండి', done: 'మీ సందర్శన పూర్తయింది', rate: 'ఈరోజు మీ అనుభవం ఎలా ఉంది?', thanks: 'ధన్యవాదాలు. మీ అభిప్రాయం మాకు సహాయపడుతుంది.', refresh: 'స్వయంచాలకంగా అప్డేట్ అవుతుంది', bad: 'ఈ లింక్ చెల్లదు. దయచేసి రిజిస్ట్రేషన్ డెస్క్ వద్ద అడగండి.', noshow: 'ఈ టోకెన్ మూసివేయబడింది. దయచేసి రిజిస్ట్రేషన్ డెస్క్‌కు వెళ్ళండి.', min: 'ని' }
  };
  const q = new URLSearchParams(location.search), id = q.get('v'), key = q.get('k');
  let lang = null, data = null, startPos = null, demo = false;
  const toast = t => { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3200); };
  const api = (p, opt) => fetch(`/api/public/visit/${encodeURIComponent(id)}${p}?k=${encodeURIComponent(key)}`, opt).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error((j.error && j.error.message) || 'Error'), { status: r.status }); return j; });

  function render() {
    const L = T[lang] || T.en, v = data;
    const langs = (v.langs || ['en']).filter(l => T[l]);
    const head = `<div class="top"><b style="font-family:var(--f-display);font-size:1.05rem">${esc(v.hospital)}</b>${langs.length > 1 ? `<div class="seg-mini">${langs.map(l => `<button data-l="${l}" aria-pressed="${l === lang}">${l === 'en' ? 'EN' : l === 'hi' ? 'हि' : 'తె'}</button>`).join('')}</div>` : ''}</div>
      <div><span class="muted small">${L.hi} ${esc(v.firstName)}</span><h1 style="font-size:1.35rem">${esc(v.dept)}</h1></div>`;
    let body = '';
    if (v.status === 'waiting') {
      if (startPos == null || v.position > startPos) startPos = v.position;
      const pct = Math.max(.05, 1 - (v.position - 1) / Math.max(startPos, 1)), C = 2 * Math.PI * 88;
      body = `<div class="ring"><svg viewBox="0 0 210 210"><circle cx="105" cy="105" r="88" stroke="var(--sunk)" stroke-width="16" fill="none"/><circle cx="105" cy="105" r="88" stroke="${v.color}" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" style="transition:stroke-dashoffset .8s"/></svg><div class="in"><div><div class="muted small">TOKEN</div><div class="tk">${esc(v.tok)}</div><div class="muted small">${v.position - 1} ${L.ahead}</div></div></div></div>
        <div class="stats card"><div><b>${v.position}</b><span class="muted small">${L.pos}</span></div><div><b>${v.etaMin}<span style="font-size:.6em"> ${L.min}</span></b><span class="muted small">${L.wait}</span></div><div><b class="mono" style="font-size:1.15rem">${esc(v.nowServing || '—')}</b><span class="muted small">${L.now}</span></div></div>
        <div class="way" style="background:color-mix(in srgb,${v.color} 14%,transparent)"><span class="muted small">${L.dir}</span><br>${esc(v.room)} · ${esc(v.floor)}</div>
        ${v.lateLeft > 0 ? `<button class="btn b-gh b-lg" id="late">${L.late}</button><p class="muted small" style="text-align:center;margin-top:-6px">${L.lateHint}</p>` : ''}`;
    } else if (v.status === 'serving') {
      body = `<div class="big card"><div style="font:800 2rem var(--f-display);color:var(--ok)">${L.turn}</div><div class="tk">${esc(v.tok)}</div><div>${L.go} <b>${esc(v.room)}</b></div><div class="way" style="background:var(--brand-soft);color:var(--brand)">${esc(v.floor)}</div></div>`;
      if (navigator.vibrate) try { navigator.vibrate([200, 100, 200]); } catch (e) { /* ignore */ }
    } else if (v.status === 'done') {
      body = `<div class="big card"><div style="font:800 1.5rem var(--f-display)">${L.done}</div><div class="muted">${esc(v.outcome || '')}</div><div>${L.rate}</div><div class="stars">${[1, 2, 3, 4, 5].map(i => `<button data-s="${i}" class="${v.rated && v.stars >= i ? 'on' : ''}" aria-label="${i} stars">★</button>`).join('')}</div>${v.rated ? `<div class="muted small">${L.thanks}</div>` : ''}</div>`;
    } else body = `<div class="empty">${L.noshow}</div>`;
    $('#app').innerHTML = head + body + `<p class="foot">${demo ? 'Demo preview · ' : ''}${L.refresh} · RayCare</p>`;
  }
  document.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.l) { lang = b.dataset.l; render(); }
    if (b.id === 'late') { if (demo) return toast('Demo preview'); try { await api('/late', { method: 'POST' }); await load(); toast('✓'); } catch (err) { toast(err.message); } }
    if (b.dataset.s) { if (demo) { data.rated = true; data.stars = +b.dataset.s; return render(); } try { await api('/feedback', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ stars: +b.dataset.s }) }); data.rated = true; data.stars = +b.dataset.s; render(); } catch (err) { toast(err.message); } }
  });
  async function load() {
    try { data = await api(''); if (!lang) lang = T[data.lang] ? data.lang : 'en'; render(); }
    catch (err) {
      if (err.status === 404 || !id) { $('#app').innerHTML = `<div class="empty" style="margin-top:40px">${T.en.bad}<br><br>${T.hi.bad}<br><br>${T.te.bad}</div>`; return false; }
      if (!data) { // no server reachable: show a labelled demo
        demo = true; lang = lang || 'en'; data = { hospital: 'Sunrise Multispeciality', langs: ['en', 'hi', 'te'], tok: 'C-118', firstName: 'Anita', dept: 'Cardiology', room: 'OPD 4', floor: 'Ground floor, follow the pink line', color: '#E0457B', status: 'waiting', position: 4, etaMin: 31, nowServing: 'C-114', lateLeft: 2 }; render();
      }
    }
    return true;
  }
  load().then(ok => { if (ok && !demo) setInterval(load, 10000); });
})();
</script>
</body>
</html>
